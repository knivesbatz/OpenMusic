name: macos

# Mac disk image: OpenSpot as one universal app (Apple silicon and Intel). Ad-hoc signed and not
# notarized (no Apple Developer account), so the first launch needs System Settings → Privacy &
# Security → Open Anyway. Kept out of build.yml because macOS runners can queue for a long time:
# Windows and Android releases never wait for them. build.yml's release job starts this workflow
# with the release's tag, and the disk images are added to that release when they're built.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Add the disk images to this existing release (e.g. v1.4.0). Empty = artifacts only."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}-${{ inputs.release_tag }}
  # A newer push to a pull request replaces the build of the older one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # For a release: a passing pull-request run that built exactly these files
  # (scripts/find-prebuilt.sh); its disk image is published and nothing is built again.
  plan:
    runs-on: ubuntu-latest
    outputs:
      prebuilt: ${{ steps.p.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prebuilt=""
          if [ -n "${{ inputs.release_tag }}" ]; then
            prebuilt=$(bash .github/scripts/find-prebuilt.sh macos.yml openspot-macos || true)
          fi
          echo "prebuilt run '${prebuilt:-none}'"
          echo "prebuilt=$prebuilt" >> "$GITHUB_OUTPUT"

  macos:
    needs: plan
    if: needs.plan.outputs.prebuilt == ''
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-openspot
      - name: Core tests on macOS
        run: cargo test -p openmusic-core
      - name: UI build
        run: |
          npm ci
          npm run build
        working-directory: ui
      - name: Bundle the OpenSpot disk image
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          # Discord Rich Presence: the OpenSpot application, else the YTSpot one (see build.yml).
          DISCORD_CLIENT_ID_OPENSPOT: ${{ vars.DISCORD_CLIENT_ID_OPENSPOT || secrets.DISCORD_CLIENT_ID_OPENSPOT }}
          DISCORD_CLIENT_ID_YTSPOT: ${{ vars.DISCORD_CLIENT_ID_YTSPOT || secrets.DISCORD_CLIENT_ID_YTSPOT }}
        # "app" too: with only "dmg", Tauri deletes the .app after packing it and the check below has nothing to look at.
        run: ../../../ui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles app,dmg
        working-directory: apps/openspot/src-tauri
      - name: Check the app bundle
        run: |
          set -e
          app=target/universal-apple-darwin/release/bundle/macos/OpenSpot.app
          test -d "$app" || { echo "::error::no $app"; ls target/universal-apple-darwin/release/bundle/macos/; exit 1; }
          test -x "$app/Contents/MacOS/OpenSpot" || { echo "::error::no OpenSpot binary in $app"; exit 1; }
          echo "bundle id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          lipo -archs "$app/Contents/MacOS/OpenSpot"
          codesign --verify --verbose=2 "$app"
          ls -l target/universal-apple-darwin/release/bundle/dmg/
      - uses: actions/upload-artifact@v4
        with:
          name: openspot-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  upload:
    needs: [plan, macos]
    if: always() && inputs.release_tag != '' && (needs.plan.outputs.prebuilt != '' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openspot-macos
          path: dmg
          run-id: ${{ needs.plan.outputs.prebuilt || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check the disk image
        run: |
          set -e
          V=$(jq -r .version apps/openspot/src-tauri/tauri.conf.json)
          ls -l dmg
          if [ ! -s "dmg/OpenSpot_${V}_universal.dmg" ]; then echo "::error::Missing OpenSpot_${V}_universal.dmg"; exit 1; fi
      - name: Add the disk images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          V=$(jq -r .version apps/openspot/src-tauri/tauri.conf.json)
          gh release upload "$TAG" "dmg/OpenSpot_${V}_universal.dmg" --repo "$GITHUB_REPOSITORY" --clobber
          # Check the release really has it.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for f in "OpenSpot_${V}_universal.dmg"; do
            echo "$assets" | grep -qxF "$f" || { echo "::error::$f is not on release $TAG"; exit 1; }
          done
