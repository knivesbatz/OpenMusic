[package]
name = "plexspot"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library is what Android loads; the desktop binary (main.rs) calls the same `run`.
[lib]
name = "plexspot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
openmusic-core = { path = "../../../crates/openmusic-core" }
# Plugins whose permissions the capabilities file grants must be direct dependencies so
# tauri-build can resolve them; the plugins themselves are initialized by openmusic-core.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Android media notification and background playback (its Kotlin library is added to the
# generated Android project through this direct dependency).
tauri-plugin-openmusic-media = { path = "../../../crates/tauri-plugin-openmusic-media" }
