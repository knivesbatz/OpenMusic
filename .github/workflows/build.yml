name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: UI install
        run: npm ci
        working-directory: ui
      - name: UI typecheck + unit tests
        run: |
          npm run typecheck
          npm test
        working-directory: ui
      - name: UI build
        run: npm run build
        working-directory: ui
      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness

  bundle:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ytspot, plexspot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}
      - name: UI build
        run: |
          npm ci
          npm run build
        working-directory: ui
      - name: Bundle ${{ matrix.app }} installer
        run: ../../../ui/node_modules/.bin/tauri build
        working-directory: apps/${{ matrix.app }}/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
