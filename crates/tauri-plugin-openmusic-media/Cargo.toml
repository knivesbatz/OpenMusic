[package]
name = "tauri-plugin-openmusic-media"
version.workspace = true
edition.workspace = true
license.workspace = true
# Lets the app's tauri-build find the Android library below and add it to the generated project.
links = "tauri-plugin-openmusic-media"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
