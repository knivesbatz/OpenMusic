[package]
name = "openmusic-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22.2"
walkdir = "2"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
url = "2"
urlencoding = "2"
thiserror = "2"
log = "0.4"
tauri-plugin-openmusic-media = { path = "../tauri-plugin-openmusic-media" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
# Artwork is shrunk to the size shown before it is cached (decode JPEG/PNG/WebP, encode JPEG).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Artist names are matched across providers after NFD (artist_merge.rs), like the UI's artistKey.
# Both already come in through url -> idna; no new crates.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }

# Desktop only: single instance, launch at startup, OS credential store. On Android, secrets live
# in the app's private storage (see secrets.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Windows Credential Manager and the macOS Keychain. Without "apple-native" keyring falls back
# to an in-memory store, and a Mac would forget the sign-in at every restart.
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# macOS: the UI is served from http://localhost (see lib.rs): YouTube's embedded player refuses
# pages on the tauri:// scheme, and the Plex player needs a plain http origin for http servers.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-localhost = "2"

# Windows: "Share audio with Discord" (audio_share.rs) relays WebView2's audio through this process.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_WinRT", "Foundation", "Media", "Storage", "Storage_Streams"] }
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3"
