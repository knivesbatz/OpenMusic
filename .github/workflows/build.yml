name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0-alpha.2). Empty = artifacts only."
        required: false
        default: ""

permissions:
  contents: write
  # The release job starts macos.yml.
  actions: write

concurrency:
  group: build-${{ github.ref }}
  # Queue rather than cancel: a run that is validating a fix should finish.
  cancel-in-progress: false

jobs:
  # What this run does. `tag`: the release to publish (a release_tag input, a pushed v* tag, or, for
  # a push to main, v<version> when that release doesn't exist yet; empty = no release). `prebuilt`:
  # a passing pull-request run that built exactly these files (scripts/find-prebuilt.sh); its
  # installer and APK are published as they are and nothing is built again.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      prebuilt: ${{ steps.p.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          V=$(jq -r .version apps/openspot/src-tauri/tauri.conf.json)
          tag=""
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$V is already released: nothing to publish"
            else
              tag="v$V"
            fi
          fi
          prebuilt=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            prebuilt=$(bash .github/scripts/find-prebuilt.sh build.yml openspot-windows openspot-android || true)
          fi
          echo "tag '$tag', prebuilt run '${prebuilt:-none}'"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prebuilt=$prebuilt" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.prebuilt == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: UI install
        run: npm ci
        working-directory: ui
      - name: UI typecheck + unit tests
        run: |
          npm run typecheck
          npm test
        working-directory: ui
      - name: UI build
        run: npm run build
        working-directory: ui
      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness

  e2e:
    needs: plan
    if: needs.plan.outputs.prebuilt == ''
    # Playwright 1.56 can't install Chromium's dependencies on ubuntu-latest's Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI build
        run: |
          npm ci
          npm run build
        working-directory: ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: UI smoke tests (mock backend)
        run: npm run e2e
        working-directory: ui


  # One version everywhere: the updater compares against CARGO_PKG_VERSION (Cargo.toml), the
  # installers are named after tauri.conf.json, and the UI shows package.json. A mismatch makes the
  # app see its own release as an update, so it fails the build. A release tag must match too.
  versions:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions match (Cargo.toml, tauri.conf.json, ui/package.json, tag)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -e
          cargo=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          conf=$(jq -r .version apps/openspot/src-tauri/tauri.conf.json)
          ui=$(jq -r .version ui/package.json)
          lock=$(jq -r .version ui/package-lock.json)
          lockroot=$(jq -r '.packages[""].version' ui/package-lock.json)
          echo "Cargo.toml $cargo, tauri.conf.json $conf, ui/package.json $ui, ui/package-lock.json $lock / $lockroot, tag '${TAG}'"
          for v in "$conf" "$ui" "$lock" "$lockroot"; do
            if [ "$v" != "$cargo" ]; then
              echo "::error::Version mismatch: Cargo.toml [workspace.package] is $cargo, but found $v (tauri.conf.json, ui/package.json and ui/package-lock.json must all match)."
              exit 1
            fi
          done
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$cargo" ]; then
            echo "::error::Release tag $TAG doesn't match version $cargo."
            exit 1
          fi

  # Built while the tests run; a release still needs every test to pass.
  bundle:
    needs: [plan, versions]
    if: needs.plan.outputs.prebuilt == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: openspot
      - name: UI build
        run: |
          npm ci
          npm run build
        working-directory: ui
      - name: Bundle the OpenSpot installer
        shell: pwsh
        env:
          # Optional Authenticode signing: base64 .pfx and its password as repository secrets.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Optional: the app's Last.fm API account (last.fm/api/account/create), compiled in so
          # users only press "Connect Last.fm".
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          # Optional: the Discord application id (discord.com/developers/applications, an app named
          # "OpenSpot") for Rich Presence. Ids are public; a repository variable or secret works.
          # Until an OpenSpot app exists, the YTSpot one is used. Without either the option is hidden.
          DISCORD_CLIENT_ID_OPENSPOT: ${{ vars.DISCORD_CLIENT_ID_OPENSPOT || secrets.DISCORD_CLIENT_ID_OPENSPOT }}
          DISCORD_CLIENT_ID_YTSPOT: ${{ vars.DISCORD_CLIENT_ID_YTSPOT || secrets.DISCORD_CLIENT_ID_YTSPOT }}
        run: |
          $extra = @()
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item $pfx
            $cfg = Join-Path $env:RUNNER_TEMP 'signing.json'
            @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } |
              ConvertTo-Json -Depth 5 | Set-Content $cfg
            $extra = @('--config', $cfg)
            Write-Host "Signing with $($cert.Subject)"
          } else {
            Write-Host "No signing certificate configured: building an unsigned installer"
          }
          ../../../ui/node_modules/.bin/tauri build @extra
        working-directory: apps/openspot/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: openspot-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Android APK. Optional on pull requests and branch builds; a release needs it.
  android:
    needs: [plan, versions]
    if: needs.plan.outputs.prebuilt == ''
    runs-on: ubuntu-latest
    continue-on-error: ${{ needs.plan.outputs.tag == '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-openspot
      - name: UI build
        run: |
          npm ci
          npm run build
        working-directory: ui
      - name: Build the OpenSpot APK
        working-directory: apps/openspot/src-tauri
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # Through npm, so the generated Gradle project calls the CLI back as 'npm run tauri'.
          # The package (applicationId) is the identifier, app.openmusic.ytspot, so OpenSpot
          # installs over YTSpot 1.x; the launcher label is productName (OpenSpot).
          npm run tauri -- android init --ci
          # The generated project starts with Tauri's placeholder launcher icons.
          npm run tauri -- icon ../../../assets/icons/openspot.png
          npm run tauri -- android build --apk true --target aarch64 --ci
      - name: Sign APK
        working-directory: apps/openspot/src-tauri
        env:
          # Optional stable signing key (base64 .jks) so updates install over each other.
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          # Public fingerprint of the stable key's certificate (not a secret).
          STABLE_CERT_SHA256: a7979368e89198b0bf222e1f1fd75e2e3db5396049a5ab47a15f0f9d26ed0bf9
        run: |
          set -e
          APK=$(find gen/android -name '*release-unsigned.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$ANDROID_KEYSTORE" ]; then
            # Pasted secrets can pick up stray spaces, line breaks or invisible non-ASCII
            # characters (Java rejects those in a password); keep only visible ASCII.
            printf '%s' "$ANDROID_KEYSTORE" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | LC_ALL=C tr -cd '\041-\176')
            if [ "$PASS" != "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "::warning::ANDROID_KEYSTORE_PASSWORD contains spaces or invisible characters; they were ignored."
            fi
          elif [ -n "$RELEASE_TAG" ]; then
            # A release signed with a throwaway key can't update the installed app: refuse.
            echo "::error::ANDROID_KEYSTORE secret missing: a release must be signed with the stable key."
            exit 1
          else
            echo "No ANDROID_KEYSTORE secret: signing with a throwaway key (uninstall before updating)."
            PASS=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias openmusic -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OpenMusic"
          fi
          "$BT/zipalign" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          NAME=$(jq -r .productName tauri.conf.json)_$(jq -r .version tauri.conf.json)_android-arm64.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$PASS" --out "out/$NAME" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/$NAME" | tee "$RUNNER_TEMP/certs.txt"
          # Releases must carry the stable key, or installed apps can't update to them.
          if [ -n "$RELEASE_TAG" ] && ! grep -qi "SHA-256 digest: $STABLE_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK isn't signed with the stable OpenMusic key (SHA-256 $STABLE_CERT_SHA256)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openspot-android
          path: apps/openspot/src-tauri/out/*.apk
          if-no-files-found: error

  # A fresh silent install of the new build: it starts, creates its library, and uninstalls cleanly.
  install-test:
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: openspot-windows
          path: new
      - name: Install, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content 'apps/openspot/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $name = $conf.productName
          $dir = Join-Path $env:LOCALAPPDATA $name
          $exe = Join-Path $dir "$($conf.mainBinaryName).exe"
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          # 1. Silent install.
          $new = Get-ChildItem new -Filter *.exe | Select-Object -First 1
          Write-Host "Running $($new.Name) /S"
          $setup = Start-Process $new.FullName -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(300000)) { throw "the installer did not finish in 5 minutes" }
          if (!(Test-Path $exe)) { throw "not installed: $exe" }
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "Installed $name $ver"
          if (-not $ver.StartsWith($conf.version)) { throw "expected version $($conf.version), got $ver" }

          # 2. It starts, creates its library and keeps running.
          $p = Start-Process $exe -PassThru
          $db = Join-Path $env:APPDATA 'app.openmusic.ytspot\library.db'
          for ($i = 0; $i -lt 60 -and !(Test-Path $db); $i++) { Start-Sleep -Seconds 1 }
          if (!(Test-Path $db)) { throw "$name did not create $db" }
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "$name exited during startup with code $($p.ExitCode)" }
          Write-Host "Running after 20 s: $([math]::Round($p.WorkingSet64 / 1MB)) MB working set (main process)"
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3

          # 3. Uninstall cleanly; the data stays (the "Delete app data" box is off in silent mode).
          # NSIS uninstallers re-launch from a temp copy, so poll for the removal.
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          if (!(Test-Path $db)) { throw "a silent uninstall deleted $db" }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).$name) { throw "uninstall left the $name Run entry" }
          Write-Host "Uninstalled"

  # Drives the real installed app through its built-in self-test to reproduce UI crashes in
  # WebView2. Diagnostic for now: it reports but doesn't block releases.
  windows-ui:
    needs: bundle
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openspot-windows
          path: new
      - name: Install OpenSpot
        shell: pwsh
        run: Start-Process (Get-ChildItem new -Filter *.exe | Select-Object -First 1).FullName -ArgumentList '/S' -Wait
      - name: Self-test in the real app (settings, scrolling, mini player, fullscreen)
        # The app clicks through itself (ui/src/selftest.ts) and logs each step; a hang or crash
        # leaves the culprit as the last "start" line, and a failed step logs "fail <step>".
        shell: pwsh
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\OpenSpot\OpenSpot.exe" -ArgumentList '--self-test' -PassThru
          $finished = $p.WaitForExit(240000)
          $log = "$env:APPDATA\app.openmusic.ytspot\selftest.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no selftest.log (the UI never started the test)" }
          if (-not $finished) { Write-Host "APP HUNG: still running after 4 minutes"; Stop-Process -Id $p.Id -Force; exit 1 }
          if (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern '\] done$' -Quiet))) { Write-Host "APP EXITED EARLY (code $($p.ExitCode))"; exit 1 }
          $failed = Select-String -Path $log -Pattern '\] fail '
          if ($failed) { Write-Host "FAILED STEPS:"; $failed | ForEach-Object { Write-Host $_.Line }; exit 1 }
          Write-Host "self-test passed"
      - name: Crash evidence (crash.log, Windows error reports)
        if: always()
        shell: pwsh
        run: |
          $log = "$env:APPDATA\app.openmusic.ytspot\crash.log"
          if (Test-Path $log) { Write-Host "---- crash.log ----"; Get-Content $log } else { Write-Host "no crash.log" }
          Write-Host "---- Application event log (OpenSpot / WebView2) ----"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'OpenSpot|msedgewebview2|WebView2' } |
            Select-Object -First 20 | Format-List TimeCreated, ProviderName, Id, Message

  release:
    # Publishes this run's installer and APK, or (`plan.prebuilt`) those of the pull-request run that
    # built and tested exactly these files. android must succeed on release runs (it is
    # continue-on-error only for other builds). The Mac disk image comes from macos.yml, which this
    # job starts once the release exists.
    needs: [plan, versions, test, e2e, bundle, install-test, android]
    if: >-
      always() && needs.plan.outputs.tag != '' && needs.versions.result == 'success' &&
      (needs.plan.outputs.prebuilt != '' ||
       (needs.test.result == 'success' && needs.e2e.result == 'success' && needs.bundle.result == 'success' &&
        needs.install-test.result == 'success' && needs.android.result == 'success'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openspot-*
          path: installers
          merge-multiple: true
          run-id: ${{ needs.plan.outputs.prebuilt || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check every asset
        env:
          # Public fingerprint of the stable Android key's certificate (as in the android job).
          STABLE_CERT_SHA256: a7979368e89198b0bf222e1f1fd75e2e3db5396049a5ab47a15f0f9d26ed0bf9
          PREBUILT: ${{ needs.plan.outputs.prebuilt }}
        run: |
          set -e
          V=$(jq -r .version apps/openspot/src-tauri/tauri.conf.json)
          if [ -n "$PREBUILT" ]; then echo "Publishing what pull-request run $PREBUILT built and tested"; fi
          cd installers
          ls -l
          for f in "OpenSpot_${V}_x64-setup.exe" "OpenSpot_${V}_android-arm64.apk"; do
            if [ ! -s "$f" ]; then echo "::error::Missing $f"; exit 1; fi
          done
          # Installed apps only update to an APK signed with the stable key.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "OpenSpot_${V}_android-arm64.apk" | tee "$RUNNER_TEMP/certs.txt"
          if ! grep -qi "SHA-256 digest: $STABLE_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK isn't signed with the stable OpenMusic key (SHA-256 $STABLE_CERT_SHA256)."
            exit 1
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          files: |
            installers/OpenSpot_*_x64-setup.exe
            installers/OpenSpot_*_android-arm64.apk
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
      - name: Build the Mac disk images for this release
        # macOS runners can queue for a long time, so they never hold up this release: macos.yml
        # adds the disk image to it (reusing the pull request's when it built these files).
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run macos.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" -f release_tag="$TAG"
      - name: Remove superseded releases
        # Only the newest release is kept.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              if [ "$tag" != "$TAG" ]; then
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              fi
            done
