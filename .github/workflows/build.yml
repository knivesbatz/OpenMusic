name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0-alpha.2). Empty = artifacts only."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # Queue rather than cancel: a run that is validating a fix should finish.
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: UI install
        run: npm ci
        working-directory: ui
      - name: UI typecheck + unit tests
        run: |
          npm run typecheck
          npm test
        working-directory: ui
      - name: UI build
        run: npm run build
        working-directory: ui
      - name: Rust tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness

  bundle:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ytspot, plexspot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}
      - name: UI build
        run: |
          npm ci
          npm run build
        working-directory: ui
      - name: Bundle ${{ matrix.app }} installer
        run: ../../../ui/node_modules/.bin/tauri build
        working-directory: apps/${{ matrix.app }}/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: installers/*.exe
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
